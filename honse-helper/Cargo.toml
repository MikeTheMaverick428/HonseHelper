[package]
name = "honse-helper-frontend"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [ 
    "Navigator", 
    "Clipboard",
    "Window", 
    "Document", 
    "HtmlInputElement", 
    "HtmlAnchorElement", 
    "HtmlSelectElement", 
    "HtmlElement", 
    "MouseEvent", 
    "InputEvent", 
    "Event",
    "CssStyleDeclaration", 
    "Blob", 
    "Url",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
gloo-console = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-macro = "0.2"
chrono = "0.4"
shared = { path = "../shared" }
rmp-serde = "1.3.1"
inventory = "0.3.24"

[[bin]]
name = "honse_helper_frontend"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
