[package]
name = "honse-explorer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "il2cpp-runtime"
path = "src/main.rs"

[dependencies]
il2cpp_runtime = { path = "../il2cpp_runtime" }
shared = { path = "../shared" }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
